<!DOCTYPE html>
<html>
<head>
  <title>스도쿠 게임</title>
    <style>
         #sudoku-grid {
            border-collapse: collapse;
            margin: auto;
            
        }

        td{
            width: 30px;
            height: 30px;
            border: 1px solid black;
            text-align: center;
            font-size: 20px;
            line-height:30px;
            
            cursor: pointer;
        }
        .bold-border {
          border: 2px solid black;
        }

         .center {
            display: flex;
            justify-content: center;
         }
          background-color : lightgray;
        }
        #generate-puzzle{
          
          display: block;
          margin : 20px auto;
        }        

        .locked {
          color: gray;
          pointer-events: none; /* Prevent clicking on locked levels */
        }
  </style>
</head>
<body>

    <h1 class = "center">스도쿠 게임</h1>
    <div class="center">
      <label for="difficulty">난이도 선택:</label>
      <select id="difficulty">
        <option value="easy">쉬움</option>
        <option value="medium" class="locked">보통</option>
        <option value="hard" class="locked">어려움</option>
        <option value="very-hard" class="locked">매우 어려움</option>
        <option value="expert" class="locked">극악</option>
      </select>
    </div>
    <table id="sudoku-grid">
    </table>
    <script>
        function createSudokuGrid() {
            
            const table = document.getElementById('sudoku-grid');

            for (let i = 0; i < 9; i++) {
                const row = document.createElement('tr');
                for (let j = 0; j < 9; j++) {
                    const cell = document.createElement('td');
                    if ((i < 3 || i > 5) && (j < 3 || j > 5) || (i >= 3 && i < 6) && (j >= 3 && j < 6))
                    {
                      cell.classList.add('bold-border');
                    }
                    
                    cell.contentEditable = true;
                    cell.addEventListener('input', function(event){
                        
                        const input = event.target.textContent;
                        
                        if(input.length > 1){
                            event.target.textContent = input.slice(0,1);
                        }

                        if (!/^[1-9]$/.test(input)) {
                            event.target.textContent = '';
                        }
                        if(!isValid(i,j,input, table))
                        {
                          this.style.backgroundColor = 'red';

                          
                        }

                        
                        
                    });

                    cell.addEventListener('keydown', (event) => {
                        const key = event.key;

                        if (key === 'Backspace' || key === 'Delete') {
                            return;
                        }

                        if (!/^[1-9]$/.test(key)) {
                            event.preventDefault();
                        }
                    });

                    cell.addEventListener('blur', function() {
                        if (isValid(i, j, this.textContent, table)) {
                            this.style.backgroundColor = 'white'; 
                        }
                    });



                    row.appendChild(cell);
                }
                table.appendChild(row);
            }
        }

        function isValid(row, col, num, table){        
          if (num === "") return true;
          
          for (let i = 0; i < 9; i++) {
            if (i !== row && table.rows[i].cells[col].textContent === num) {
                return false;
            }
          }

        
          for (let i = 0; i < 9; i++) {
            if (i !== col) {
                if (table.rows[row].cells[i].textContent === num) {
                    return false;
                }
            }

            } 
            
          }

          const startRow = Math.floor(row/3) * 3;
          const startCol = Math.floor(col/3) * 3;

          for(let i = startRow ; i < startRow + 3 ; i++){
            for (let j = startCol; j < startCol + 3; j++) {
              if (!(i === row && j === col) && table.rows[i].cells[j].textContent === num) {
                  return false;
              }
            } 
          } 

          return true; 

        } 
        function isSudokuSolved() {
          const table = document.getElementById('sudoku-grid');
          const gridSize = 9;
          let numbers;

          // Check rows
          for (let row = 0; row < gridSize; row++) {
              numbers = new Set();
              for (let col = 0; col < gridSize; col++) {
                  const cellValue = table.rows[row].cells[col].textContent;
                  if (cellValue === "" || numbers.has(cellValue)) return false;
                  numbers.add(cellValue);
              }
          }

          // Check columns
          for (let col = 0; col < gridSize; col++) {
              numbers = new Set();
              for (let row = 0; row < gridSize; row++) {
                  const cellValue = table.rows[row].cells[col].textContent;
                  if (cellValue === "" || numbers.has(cellValue)) return false;
                  numbers.add(cellValue);
              }
          }

          // Check 3x3 blocks
          for (let blockRow = 0; blockRow < 3; blockRow++) {
              for (let blockCol = 0; blockCol < 3; blockCol++) {
                  numbers = new Set();
                  for (let row = blockRow * 3; row < blockRow * 3 + 3; row++) {
                      for (let col = blockCol * 3; col < blockCol * 3 + 3; col++) {
                          const cellValue = table.rows[row].cells[col].textContent;
                          if (cellValue === "" || numbers.has(cellValue)) return false;
                          numbers.add(cellValue);
                      }
                  }
              }
          }
          return true;
      }

      function generateSudokuPuzzle() {
          // 완전한 스도쿠 퍼즐 생성 (일단 임의의 퍼즐로 가정)
          const fullPuzzle = [
              [5, 3, 4, 6, 7, 8, 9, 1, 2],
              [6, 7, 2, 1, 9, 5, 3, 4, 8],
              [1, 9, 8, 3, 4, 2, 5, 6, 7],
              [8, 5, 9, 7, 6, 1, 4, 2, 3],
              [4, 2, 6, 8, 5, 3, 7, 9, 1],
              [7, 1, 3, 9, 2, 4, 8, 5, 6],
              [9, 6, 1, 5, 3, 7, 2, 8, 4],
              [2, 8, 7, 4, 1, 9, 6, 3, 5],
              [3, 4, 5, 2, 8, 6, 1, 7, 9]
          ];


          let difficulty = document.getElementById("difficulty").value;
          // 퍼즐 복사
          const puzzle = fullPuzzle.map(row => row.slice());

          // 난이도에 따라 제거할 숫자의 개수 설정
          // 더 많은 수를 제거할수록 어려움
          const numbersToRemove = getNumbersToRemove(difficulty);

          // 제거할 숫자 무작위로 선택
          let numbersToRemove;

          switch (difficulty) {
              case 'easy':
                  numbersToRemove = 30; // 쉬움 난이도: 30개의 숫자 제거
                  break;
              case 'medium':
                  numbersToRemove = 40; // 보통 난이도: 40개의 숫자 제거
                  break;
              case 'hard':
                  numbersToRemove = 50; // 어려움 난이도: 50개의 숫자 제거
                  break;
              case 'very-hard':
                  numbersToRemove = 60; // 매우 어려움 난이도: 60개의 숫자 제거
                  break;
              case 'expert':
                  numbersToRemove = 70; // 극악 난이도: 70개의 숫자 제거
                  break;
              default:
                  numbersToRemove = 30; // 기본적으로 쉬움 난이도
          }

          removeNumbers(puzzle, numbersToRemove);

          // UI 업데이트
          updateSudokuGrid(puzzle);
      }
      function getNumbersToRemove(difficulty) {
        switch (difficulty) {
            case 'easy': return 30;
            case 'medium': return 40;
            case 'hard': return 50;
            case 'very-hard': return 60;
            case 'expert': return 70;
            default: return 30;
        }
    }
    function removeNumbers(puzzle, numbersToRemove) {
      let removedCount = 0;
        while (removedCount < numbersToRemove) {
            const row = Math.floor(Math.random() * 9);
            const col = Math.floor(Math.random() * 9);
            if (puzzle[row][col] !== 0) {
                puzzle[row][col] = 0;
                removedCount++;
            }
        }
    }


        function clearSudoku() {
          clearSudokuGrid();
        }

        function clearSudokuGrid(){
          const table = document.getElementById('sudoku-grid');
          for (let i = 0; i < 9; i++) {
            for (let j = 0; j < 9; j++) {
                const cell = table.rows[i].cells[j];
                cell.textContent = "";
            }
        }
      }

      function updateSudokuGrid(puzzle) {
        const table = document.getElementById('sudoku-grid');
        for (let i = 0; i < 9; i++) {
            for (let j = 0; j < 9; j++) {
                const cell = table.rows[i].cells[j];
                cell.textContent = puzzle[i][j] === 0 ? "" : puzzle[i][j];
                cell.style.backgroundColor = "white";
                cell.classList.remove("initial-value");
                if(puzzle[i][j] !== 0){
                  cell.classList.add("initial-value");
                }
            }
        }
    
        }

        window.onload = () => {
          createSudokuGrid();
          generateSudokuPuzzle();
          loadProgress();
          
        }

        // 로컬 스토리지에서 진행 상황 불러오기
        function loadProgress() {
            const completedLevels = localStorage.getItem('completedLevels');
            if (completedLevels) {
                const levels = JSON.parse(completedLevels);
                unlockLevels(levels);
            }
        }

        // 레벨 잠금 해제
        function unlockLevels(levels) {
          const difficultyOptions = document.querySelectorAll('#difficulty option');
            difficultyOptions.forEach(option => {
                const level = option.value;
                if (levels.includes(level)) {
                    option.classList.remove('locked');
                }
            });
        }

        // 현재 난이도 완료 시 다음 난이도 잠금 해제
        function unlockNextLevel() {
          const difficultySelect = document.getElementById("difficulty");
            const currentDifficulty = difficultySelect.value;
            const difficultyOptions = Array.from(difficultySelect.options);
            const currentOptionIndex = difficultyOptions.findIndex(option => option.value === currentDifficulty);

            // 다음 난이도가 존재하고, 잠금 상태인 경우에만 잠금 해제
            if (currentOptionIndex < difficultyOptions.length - 1) {
                const nextOption = difficultyOptions[currentOptionIndex + 1];
                if (nextOption.classList.contains('locked')) {
                    nextOption.classList.remove('locked');
                    saveProgress(nextOption.value);
                }
            }
        }

        // 로컬 스토리지에 진행 상황 저장
        function saveProgress(unlockedLevel) {
            let completedLevels = localStorage.getItem('completedLevels');
            let levels = completedLevels ? JSON.parse(completedLevels) : [];

            if (!levels.includes(unlockedLevel)) {
                levels.push(unlockedLevel);
                localStorage.setItem('completedLevels', JSON.stringify(levels));
            }
        }





    </script>    
    <div class="center">
        <button onclick="if (isSudokuSolved()) {
          alert('정답입니다!');
          unlockNextLevel();
        } else {
          alert('오답입니다.');
        }">정답 확인</button>
    </div>    

    <div class="center">
        <button id="generate-puzzle" onclick = "clearSudokuGrid();generateSudokuPuzzle();">퍼즐 생성</button>
        <button onclick="clearSudoku()">초기화</button>
    </div>    

</body>
</html>
