<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>재구매 상품 리스트</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
	<style>
		.main_box {
			width: 1200px;
			margin: 0 auto;
			position: relative;
			text-align: center;
			padding: 20px;
		}
		input {
			height: 33px;
			padding: 0 10px;
			border-radius: 5px !important;
			font-size: 14px;
		}
		input, select, textarea {
			box-sizing: border-box;
			border: 1px solid #ccc;
			-webkit-border-radius: 0;
		}
		select {
			width: 85%;
			float: left;
			text-align: center;
			box-sizing: border-box;
			padding: 10px;
			border-radius: 5px;
		}
	</style>
	<div class="main_box">
		<div style="text-align:center;">
			<img src="/images/logo.png" style="width:100px; margin-right: 10px;">
			<h1 style="display: inline-block; vertical-align: bottom;">재구매 상품 리스트</h1><br/>
			<input type="button" value="step 1" onclick="copy_code('step1')"/>
			<input type="button" value="step 2" onclick="copy_code('step2')"/>
			<input type="button" value="자동스크롤" onclick="copy_code('step3')"/>
			<input type="button" onclick="location.href='https://shopping.naver.com/gift/category'" value="네이버 선물샵" />
			<input type="button" onclick="insert_data();" value="복사한 데이터 리스트로 표시" />
		</div>
		<div class="list_box"></div>

		<textarea id="step1" style="display: none;">
			const titles = [];

			document.querySelectorAll('li').forEach(li => {
				if (li.textContent.includes('재구매')) {
					li.style.backgroundColor = 'red';
					li.classList.add("reshop");
				}
			});

			document.querySelectorAll('.reshop').forEach(title => {
				if (!titles.includes(title.innerHTML)) { // 중복 확인
					titles.push(title.innerHTML);
				}
				title.classList.remove("reshop");
			});

			// 스크롤 내리다가 productCardListResponsive_product_card_list_responsive__IEG45 이 클래스 안의 내용이 변하면 step2 실행 반복

			// 감지할 타겟
			var target = document.querySelectorAll('.productCardListResponsive_product_card_list_responsive__IEG45');

			// 변경을 감지했을 때 실행할 부분
			var observer = new MutationObserver(mutations => {
			mutations.forEach(mutation => {
				var content = mutation.addedNodes[0];
				
				if (content && content.innerHTML.includes('재구매')) {
					content.style.backgroundColor = 'red';
					content.classList.add("reshop");

					// 중복 확인 후 titles에 추가
					if (!titles.includes(content.innerHTML)) {
						titles.push(content.innerHTML);
					}
				}
			});
			});

			// 감지 설정
			var config = {
			childList: true,   // 타겟의 하위 요소 추가 및 제거 감지
			attributes: false,   // 타켓의 속성 변경를 감지
			characterData: false,   // 타겟의 데이터 변경 감지
			subtree: false,   // 타겟의 자식 노드 아래로도 모두 감지
			attributeOldValue: false,   // 타겟의 속성 변경 전 속성 기록
			characterDataOldValue: false   // 타겟의 데이터 변경 전 데이터 기록
			};

			// 감지 시작
			observer.observe(target[0], config);
		</textarea>

		<textarea id="step2" style="display: none;">
			// 감지 종료
			observer.disconnect();

			const titlesText = titles.join(' ');
			console.log(titlesText);

			if (titles.length > 0) {
				const copyButton = document.createElement('button');
				copyButton.textContent = '복사하기';
				copyButton.style.position = 'fixed';
				copyButton.style.top = '10px';
				copyButton.style.right = '10px';
				copyButton.style.padding = '10px 15px';
				copyButton.style.backgroundColor = 'blue';
				copyButton.style.color = 'white';
				copyButton.style.border = 'none';
				copyButton.style.borderRadius = '5px';
				copyButton.style.cursor = 'pointer';
				copyButton.style.zIndex = '111';
				document.body.appendChild(copyButton);

				copyButton.addEventListener('click', () => {
					navigator.clipboard.writeText(titlesText).then(() => {
						alert('텍스트가 복사되었습니다!');
					}).catch(err => {
						console.error('복사 실패:', err);
					});
				});
			}
		</textarea>

		<textarea id="step3" style="display: none;">
			//스크롤 count 숫자만큼 내려주기

			async function scrollToBottom(count) {
			let previousHeight = 0;
			for(var i=0; i <= count; i++) {
				const currentHeight = document.body.scrollHeight;
				window.scrollTo(0, currentHeight);
				await new Promise(resolve => setTimeout(resolve, 500));
				if (currentHeight === previousHeight) {
				break;
				}
				previousHeight = currentHeight;
			}
			}

			scrollToBottom(숫자입력);
		</textarea>
	</div>

    <script>
		function copy_code(step) {
			$('#'+step).show();
			$('#'+step).select();

			var copy = document.execCommand('copy');

			$('#'+step).hide();

			if(copy) {
				alert("데이터가 복사되었습니다.");
			}
		}

		function insert_data() {
			var textarea = $("#insert_data");

			getClipboardTextModern().then(function (clipboardContent) {
				console.log("Clipboard Content:", clipboardContent);
				$(".list_box").html(clipboardContent);
			}).catch(function (err) {
				console.error("Failed to read clipboard content:", err);
			});
		}

		// 클립보드의 텍스트를 가져오기
		function getClipboardTextModern() {
			return navigator.clipboard.readText(); // 붙여넣기
		}
    </script>
</body>
</html>
