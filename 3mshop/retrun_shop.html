<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>재구매 상품 리스트</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
	<style>
		.main_box {
			width: 1200px;
			margin: 0 auto;
			position: relative;
			text-align: center;
			padding: 20px;
		}
		input {
			height: 33px;
			padding: 0 10px;
			border-radius: 5px !important;
			font-size: 14px;
		}
		input, select, textarea {
			box-sizing: border-box;
			border: 1px solid #ccc;
			-webkit-border-radius: 0;
		}
		select {
			width: 85%;
			float: left;
			text-align: center;
			box-sizing: border-box;
			padding: 10px;
			border-radius: 5px;
		}
	</style>
	<div class="main_box">
		<div style="text-align:center;">
			<img src="/images/logo.png" style="width:100px; margin-right: 10px;">
			<h1 style="display: inline-block; vertical-align: bottom;">재구매 상품 리스트</h1>
		</div>
		
	</div>

    <script>
		
    </script>
</body>
</html>
